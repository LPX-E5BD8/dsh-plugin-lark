name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  attestations: read

jobs:
  linux_release:
    name: Linux release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check:release-version
      - run: npm run check
      - run: npm audit --omit=dev
      - name: Download and verify the Web-profile upgrade baseline
        id: upgrade-baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_DIR: ${{ runner.temp }}/upgrade-baseline
          BASELINE_TAG: v0.9.8
          BASELINE_COMMIT: d0921e4d1186dc256bc3eff587cc929da5dc8bad
          BASELINE_DIGEST: sha256:796b73c23ff8a3cd9d2d58ce6edd5d8257f79986769bfd1cb1d99d0c4f218204
        run: |
          set -eu
          test ! -e "$BASELINE_DIR"
          mkdir "$BASELINE_DIR"
          chmod 700 "$BASELINE_DIR"
          version="${BASELINE_TAG#v}"
          archive_name="dsh-plugin-lark-${version}.tgz"
          archive_path="$BASELINE_DIR/$archive_name"
          gh release download "$BASELINE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive_name" \
            --dir "$BASELINE_DIR"
          test -f "$archive_path"
          test "$(find "$BASELINE_DIR" -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          archive_sha="$(sha256sum -- "$archive_path")"
          archive_sha="${archive_sha%% *}"
          test "sha256:${archive_sha}" = "$BASELINE_DIGEST"

          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${BASELINE_TAG}" --jq '.object.type + ":" + .object.sha')"
          object_type="${tag_object%%:*}"
          object_sha="${tag_object#*:}"
          test "$object_type" = 'tag'
          peel_depth=0
          while [ "$object_type" = 'tag' ]; do
            peel_depth=$((peel_depth + 1))
            test "$peel_depth" -le 8
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.type + ":" + .object.sha')"
            object_type="${tag_object%%:*}"
            object_sha="${tag_object#*:}"
          done
          test "$object_type" = 'commit'
          test "$object_sha" = "$BASELINE_COMMIT"

          release_json="$(gh release view "$BASELINE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,isPrerelease,targetCommitish)"
          printf '%s' "$release_json" | jq -e \
            --arg commit "$BASELINE_COMMIT" --arg name "$archive_name" --arg digest "$BASELINE_DIGEST" \
            '.targetCommitish == $commit and .isDraft == false and .isPrerelease == false
              and ([.assets[] | select(.name == $name and .state == "uploaded" and .digest == $digest)] | length) == 1
              and ([.assets[] | select(.name == $name)] | length) == 1' >/dev/null
          packed_version="$(tar -xOf "$archive_path" package/package.json | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => console.log(JSON.parse(value).version))")"
          test "$packed_version" = "$version"

          verification="$RUNNER_TEMP/upgrade-baseline-provenance.json"
          gh attestation verify "$archive_path" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref refs/heads/main \
            --source-digest "$BASELINE_COMMIT" \
            --deny-self-hosted-runners \
            --format json > "$verification"
          jq -e --arg name "$archive_name" --arg digest "$archive_sha" \
            'any(.[]; any(.verificationResult.statement.subject[]; .name == $name and .digest.sha256 == $digest))' \
            "$verification" >/dev/null
          echo "path=${archive_path}" >> "$GITHUB_OUTPUT"
      - name: Pack and install the release archive
        env:
          DSH_PACK_ARTIFACT_DIR: ${{ runner.temp }}/release-package
        run: npm run test:pack
      - name: Verify packed Web-profile install and upgrade
        env:
          DSH_PROFILE_BASELINE_PACKAGE: ${{ steps.upgrade-baseline.outputs.path }}
          DSH_PROFILE_CANDIDATE_DIR: ${{ runner.temp }}/release-package
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          export DSH_PROFILE_CANDIDATE_PACKAGE="$DSH_PROFILE_CANDIDATE_DIR/dsh-plugin-lark-${version}.tgz"
          npm run test:profile
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Verify Node.js 24 compatibility
        env:
          DSH_PROFILE_BASELINE_PACKAGE: ${{ steps.upgrade-baseline.outputs.path }}
          DSH_PROFILE_CANDIDATE_DIR: ${{ runner.temp }}/release-package
          DSH_PROFILE_EXPECT_NODE_MAJOR: '24'
          npm_config_cache: ${{ runner.temp }}/node-24-npm-cache
          npm_config_engine_strict: 'true'
        run: |
          set -eu
          test "$(node -p "process.platform + ':' + process.arch")" = 'linux:x64'
          test "$(node -p "process.versions.node.split('.')[0]")" = '24'
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev
          npm run test:pack
          version="$(node -p "require('./package.json').version")"
          export DSH_PROFILE_CANDIDATE_PACKAGE="$DSH_PROFILE_CANDIDATE_DIR/dsh-plugin-lark-${version}.tgz"
          test -f "$DSH_PROFILE_CANDIDATE_PACKAGE"
          npm run test:profile
      - name: Upload the tested release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ github.sha }}
          path: ${{ runner.temp }}/release-package
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  macos:
    name: macOS package compatibility (Node.js ${{ matrix.node }})
    needs: linux_release
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Download the canonical release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package-${{ github.sha }}
          path: ${{ runner.temp }}/release-package
          digest-mismatch: error
      - name: Verify macOS 26 arm64 package compatibility
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
          PACKAGE_DIR: ${{ runner.temp }}/release-package
          npm_config_engine_strict: 'true'
        run: |
          set -eu
          test "$(node -p "process.platform + ':' + process.arch")" = 'darwin:arm64'
          test "$(node -p "process.versions.node.split('.')[0]")" = "$EXPECTED_NODE_MAJOR"
          case "$(sw_vers -productVersion)" in 26.*) ;; *) exit 1 ;; esac
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev
          npm run test:pack
          version="$(node -p "require('./package.json').version")"
          export DSH_PACK_INPUT_PACKAGE="$PACKAGE_DIR/dsh-plugin-lark-${version}.tgz"
          test -f "$DSH_PACK_INPUT_PACKAGE"
          npm run test:pack

  test:
    name: test
    if: ${{ always() }}
    needs: [linux_release, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every release gate
        env:
          LINUX_RESULT: ${{ needs.linux_release.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          set -eu
          test "$LINUX_RESULT" = success
          test "$MACOS_RESULT" = success

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIOUS_MAIN_SHA: ${{ github.event.before }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Wait for the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_version="$(git show "${PREVIOUS_MAIN_SHA}:package.json" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => console.log(JSON.parse(value).version))")"
          base_tag="v${base_version}"
          for attempt in $(seq 1 120); do
            git fetch --tags --force
            if git rev-parse --verify --quiet "refs/tags/${base_tag}" >/dev/null; then
              base_target="$(git rev-list -n 1 "$base_tag")"
              if [ "$base_target" != "$PREVIOUS_MAIN_SHA" ]; then
                echo "::error::${base_tag} points to ${base_target}, not previous main ${PREVIOUS_MAIN_SHA}"
                exit 1
              fi
              if release_json="$(gh release view "$base_tag" --json isDraft,isPrerelease,targetCommitish 2>/dev/null)" \
                && printf '%s' "$release_json" | jq -e --arg sha "$PREVIOUS_MAIN_SHA" \
                  '.targetCommitish == $sha and .isDraft == false and .isPrerelease == false' >/dev/null; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::previous release ${base_tag} was not available"
          exit 1
      - name: Download the tested release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package-${{ github.sha }}
          path: ${{ runner.temp }}/release-package
          digest-mismatch: error
      - name: Validate the tested release archive
        id: package
        env:
          PACKAGE_DIR: ${{ runner.temp }}/release-package
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          expected_name="dsh-plugin-lark-${version}.tgz"
          set -- "$PACKAGE_DIR"/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one tested package archive"
            exit 1
          fi
          package_path="$1"
          package_name="$(basename "$package_path")"
          if [ "$package_name" != "$expected_name" ]; then
            echo "::error::expected ${expected_name}, got ${package_name}"
            exit 1
          fi
          packed_name="$(tar -xOf "$package_path" package/package.json | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => console.log(JSON.parse(value).name))")"
          packed_version="$(tar -xOf "$package_path" package/package.json | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => console.log(JSON.parse(value).version))")"
          test "$packed_name" = 'dsh-plugin-lark'
          test "$packed_version" = "$version"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            target="$(git rev-list -n 1 "$tag")"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::${tag} already points to ${target}, not ${GITHUB_SHA}"
              exit 1
            fi
          else
            RELEASE_BASE_SHA="$PREVIOUS_MAIN_SHA" node scripts/check-release-version.mjs
          fi
          package_sha="$(sha256sum -- "$package_path")"
          package_sha="${package_sha%% *}"
          test "${#package_sha}" -eq 64
          case "$package_sha" in *[!0-9a-f]*) exit 1 ;; esac
          package_digest="sha256:${package_sha}"
          echo "path=${package_path}" >> "$GITHUB_OUTPUT"
          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "digest=${package_digest}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Check for existing package provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          verification="$RUNNER_TEMP/existing-package-provenance.json"
          if gh attestation verify "$PACKAGE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > "$verification" 2>/dev/null \
            && jq -e --arg name "$PACKAGE_NAME" --arg digest "${PACKAGE_DIGEST#sha256:}" \
              'any(.[]; any(.verificationResult.statement.subject[]; .name == $name and .digest.sha256 == $digest))' \
              "$verification" >/dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Attest the tested release archive
        id: attestation
        if: steps.provenance.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.path }}
          subject-name: ${{ steps.package.outputs.name }}
      - name: Verify the generated provenance bundle
        if: steps.provenance.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.digest }}
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attestation.outputs.attestation-id }}
        run: |
          set -eu
          test -s "$ATTESTATION_BUNDLE"
          case "$ATTESTATION_ID" in ''|*[!0-9]*) exit 1 ;; esac
          verification="$RUNNER_TEMP/generated-package-provenance.json"
          gh attestation verify "$PACKAGE_PATH" \
            --bundle "$ATTESTATION_BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > "$verification"
          jq -e --arg name "$PACKAGE_NAME" --arg digest "${PACKAGE_DIGEST#sha256:}" \
            'any(.[]; any(.verificationResult.statement.subject[]; .name == $name and .digest.sha256 == $digest))' \
            "$verification" >/dev/null
      - name: Verify package provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          verification="$RUNNER_TEMP/package-provenance.json"
          verified=0
          for attempt in $(seq 1 12); do
            if gh attestation verify "$PACKAGE_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --format json > "$verification" 2>/dev/null \
              && jq -e --arg name "$PACKAGE_NAME" --arg digest "${PACKAGE_DIGEST#sha256:}" \
                'any(.[]; any(.verificationResult.statement.subject[]; .name == $name and .digest.sha256 == $digest))' \
                "$verification" >/dev/null; then
              verified=1
              break
            fi
            sleep 5
          done
          if [ "$verified" -ne 1 ]; then
            echo "::error::package provenance was not verifiable"
            exit 1
          fi
      - name: Tag the tested commit
        env:
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "dsh-plugin-lark ${VERSION}" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"
      - name: Create or verify the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          set -eu
          release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null || true)"
          case "$release_id" in ''|*[!0-9]*)
            release_id=''
            for attempt in 1 2 3; do
              gh release create "$TAG" \
                --verify-tag \
                --target "$GITHUB_SHA" \
                --title "dsh-plugin-lark ${VERSION}" \
                --generate-notes \
                --draft || true
              candidate_id="$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null || true)"
              case "$candidate_id" in ''|*[!0-9]*) ;; *) release_id="$candidate_id" ;; esac
              if [ -n "$release_id" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$release_id" ]; then
              echo "::error::could not create ${TAG} as a draft release"
              exit 1
            fi
            ;;
          esac
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          release_json=''
          for attempt in $(seq 1 12); do
            if release_json="$(gh api "$release_endpoint" 2>/dev/null)"; then
              break
            fi
            sleep 5
          done
          if [ -z "$release_json" ]; then
            echo "::error::could not load ${TAG} release ${release_id}"
            exit 1
          fi
          if ! printf '%s' "$release_json" | jq -e \
            --arg tag "$TAG" --arg sha "$GITHUB_SHA" \
            '.tag_name == $tag and .target_commitish == $sha and .prerelease == false' >/dev/null; then
            echo "::error::${TAG} release metadata conflicts with ${GITHUB_SHA}"
            exit 1
          fi

          asset_verified=0
          upload_attempts=0
          empty_observations=0
          incomplete_asset_id=''
          incomplete_observations=0
          for attempt in $(seq 1 36); do
            if ! release_json="$(gh api "$release_endpoint" 2>/dev/null)"; then
              sleep 5
              continue
            fi
            if ! printf '%s' "$release_json" | jq -e \
              --arg tag "$TAG" --arg sha "$GITHUB_SHA" \
              '.tag_name == $tag and .target_commitish == $sha and .prerelease == false' >/dev/null; then
              echo "::error::${TAG} release metadata changed during reconciliation"
              exit 1
            fi
            asset_count="$(printf '%s' "$release_json" | jq --arg name "$PACKAGE_NAME" '[.assets[] | select(.name == $name)] | length')"
            if [ "$asset_count" -gt 1 ]; then
              echo "::error::${TAG} has multiple ${PACKAGE_NAME} assets"
              exit 1
            fi
            if [ "$asset_count" -eq 0 ]; then
              incomplete_asset_id=''
              incomplete_observations=0
              empty_observations=$((empty_observations + 1))
              if [ "$upload_attempts" -eq 0 ] || [ "$empty_observations" -ge 3 ]; then
                upload_attempts=$((upload_attempts + 1))
                empty_observations=0
                if [ "$upload_attempts" -gt 3 ]; then
                  echo "::error::could not upload ${PACKAGE_NAME} after three attempts"
                  exit 1
                fi
                if ! gh release upload "$TAG" "$PACKAGE_PATH"; then
                  echo "::warning::asset upload attempt ${upload_attempts} failed; checking for a recoverable placeholder"
                fi
              fi
            else
              empty_observations=0
              asset_id="$(printf '%s' "$release_json" | jq -r --arg name "$PACKAGE_NAME" '.assets[] | select(.name == $name) | .id')"
              asset_state="$(printf '%s' "$release_json" | jq -r --arg name "$PACKAGE_NAME" '.assets[] | select(.name == $name) | .state')"
              asset_digest="$(printf '%s' "$release_json" | jq -r --arg name "$PACKAGE_NAME" '.assets[] | select(.name == $name) | .digest // empty')"
              if [ -n "$asset_digest" ] && [ "$asset_digest" != "$PACKAGE_DIGEST" ]; then
                echo "::error::${PACKAGE_NAME} digest conflict: ${asset_digest}"
                exit 1
              fi
              if [ "$asset_state" = 'uploaded' ] && [ "$asset_digest" = "$PACKAGE_DIGEST" ]; then
                asset_verified=1
                break
              fi
              if { [ "$asset_state" = 'open' ] || [ "$asset_state" = 'starter' ]; } && [ -z "$asset_digest" ]; then
                case "$asset_id" in ''|*[!0-9]*) exit 1 ;; esac
                if [ "$incomplete_asset_id" = "$asset_id" ]; then
                  incomplete_observations=$((incomplete_observations + 1))
                else
                  incomplete_asset_id="$asset_id"
                  incomplete_observations=1
                fi
                if [ "$incomplete_observations" -ge 3 ]; then
                  asset_endpoint="repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                  if incomplete_json="$(gh api "$asset_endpoint" 2>/dev/null)" \
                    && printf '%s' "$incomplete_json" | jq -e --arg name "$PACKAGE_NAME" \
                      '.name == $name and (.state == "open" or .state == "starter") and (.digest // "") == ""' >/dev/null; then
                    echo "::warning::removing confirmed incomplete ${PACKAGE_NAME} asset ${asset_id} before retry"
                    if ! gh api --method DELETE "$asset_endpoint"; then
                      echo "::warning::could not remove incomplete asset ${asset_id}; retrying observation"
                    fi
                  fi
                  incomplete_asset_id=''
                  incomplete_observations=0
                fi
              elif [ "$asset_state" != 'uploaded' ] || [ -n "$asset_digest" ]; then
                echo "::error::${PACKAGE_NAME} has unexpected state ${asset_state}"
                exit 1
              else
                incomplete_asset_id=''
                incomplete_observations=0
              fi
            fi
            sleep 5
          done
          if [ "$asset_verified" -ne 1 ]; then
            echo "::error::${PACKAGE_NAME} was not published with the expected digest"
            exit 1
          fi

          if [ "$(printf '%s' "$release_json" | jq -r '.draft')" = 'true' ]; then
            release_published=0
            for attempt in 1 2 3; do
              if gh release edit "$TAG" --draft=false --prerelease=false; then
                release_published=1
                break
              fi
              sleep 5
            done
            if [ "$release_published" -ne 1 ]; then
              echo "::error::could not publish ${TAG} draft"
              exit 1
            fi
          fi
          release_verified=0
          for attempt in $(seq 1 12); do
            if ! release_json="$(gh api "$release_endpoint" 2>/dev/null)"; then
              sleep 5
              continue
            fi
            if printf '%s' "$release_json" | jq -e \
              --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg name "$PACKAGE_NAME" --arg digest "$PACKAGE_DIGEST" \
              '.tag_name == $tag and .target_commitish == $sha and .draft == false and .prerelease == false
                and ([.assets[] | select(.name == $name and .state == "uploaded" and .digest == $digest)] | length) == 1
                and ([.assets[] | select(.name == $name)] | length) == 1' >/dev/null; then
              release_verified=1
              break
            fi
            sleep 5
          done
          if [ "$release_verified" -ne 1 ]; then
            echo "::error::${TAG} was not published as an exact final release"
            exit 1
          fi
