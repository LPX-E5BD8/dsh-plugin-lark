# Credentials come from DSH_LARK_APP_ID and DSH_LARK_APP_SECRET.
# Requires agents, sessions, and storageDomain; the stock Web profile mounts all three.
- insert:
    - id: lark
      name: dsh-plugin-lark
      config:
        domain: feishu
        locale: zh-CN
        allowAllUsers: false
        allowFrom: []
        projectManageFrom: []
        operatorFrom: []
        defaultSessionId: ""
        provider: deepseek-official
        model: deepseek-v4-flash
        streamUpdateIntervalMs: 1000
        maxConversationHandles: 32
        inboundTextFiles: false
        maxInboundTextFileBytes: 131072
        inboundImages: false
        maxInboundImageBytes: 5242880
        maxInboundImagePixels: 20000000
        maxConversationImages: 4
        maxConversationImageBytes: 20971520
        outboundArtifacts: false
        maxOutboundTextFileBytes: 131072
        maxOutboundImageBytes: 5242880
        maxOutboundImagePixels: 20000000
        proactiveDelivery: false
        runtimeDir: ""
        runtimeOwnerTtlMs: 30000
        parallelTasks: false
        maxParallelTasks: 2
        taskWorkspaces: exclusive
        documentHandoff: false
        maxDocumentReadBytes: 65536
        maxDocumentPublishBytes: 262144
