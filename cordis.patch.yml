# Credentials come from DSH_LARK_APP_ID and DSH_LARK_APP_SECRET.
# Requires agents, sessions, and storageDomain; the stock Web profile mounts all three.
- insert:
    - id: lark
      name: dsh-plugin-lark
      config:
        domain: feishu
        locale: zh-CN
        allowAllUsers: false
        allowFrom: []
        projectManageFrom: []
        defaultSessionId: ""
        maxConversationHandles: 32
        inboundTextFiles: false
        maxInboundTextFileBytes: 131072
